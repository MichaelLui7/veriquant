[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "veriquant"
version = "0.1.0"
description = "VeriQuant: formal verification + Ray distributed backtesting + AI agent quant engine"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "ray>=2.30",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "hypothesis>=6.100",
]
mcp = [
    "mcp>=1.0,<2.0",
]

[project.scripts]
veriquant = "agent_cli.main:app"

[tool.setuptools]
packages = ["core_engine", "distributed", "strategies", "data_layer", "risk_control", "agent_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:invalid escape sequence:DeprecationWarning",
]